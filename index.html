<style>
body,html{
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100vh;
    font-family: sans-serif;
}
.Section_top{
    width: 100%;
    height: 100%;
    overflow: hidden;
    position: relative;
    background-image: url(Images11/28.jpeg);
    background-position: center;
    background-repeat: no-repeat;
    background-size: cover;
    text-align: center;
    justify-content: center;
    animation: change 10s infinite ease-in-out;
}
.content{
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-transform: uppercase;

}
.content h1{
    color: #fff;
    font-size: 60px;
    letter-spacing: 15px;
}
.content h1 span{
    color: #111;
}
.content a{
    background-color:lightchoral;
	color: white;
    padding: 10px 24px;
    text-decoration: none;
    font-size: 18px;
    border-radius: 20px;
}
.content a:hover{
    background: #f08080;
    color: white;
}
@keyframes change{
    0%
    {
        background-image: url(Images11/1.jpeg);
    }
    20%
    {
        background-image: url(Images11/19.jpeg);
    }
    40%
    {
        background-image: url(Images11/37.jpeg);
    }
    60%
    {
        background-image: url(Images11/27.jpeg);
    }
    80%
    {
        background-image: url(Images11/7.jpeg);
    }
    100%
    {
        background-image: url(Images11/22.jpeg);
    }
}
/* social media icons styling */
.social-icons {
    font-size: 36px;
    cursor: pointer;
}
.fa-facebook:hover,.fa-instagram:hover,.fa-twitter:hover,.fa-linkedin:hover, .fa-twitch:hover {
    color: #008000;
}
.fab {
    color: #000000;
}


</style>
